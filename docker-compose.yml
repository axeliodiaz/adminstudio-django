services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: adminstudio
      POSTGRES_USER: adminstudio
      POSTGRES_PASSWORD: adminstudio
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adminstudio -d adminstudio"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    user: "1000:1000"
    command: >
      sh -c "
      python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      gunicorn adminstudio_django.wsgi:application --bind 0.0.0.0:80 --workers 3 --threads 2 --timeout 120
    "
    ports:
      - "80:80"
    environment:
      DJANGO_SETTINGS_MODULE: adminstudio_django.settings.prod
      DJANGO_DEBUG: "False"
      DJANGO_ENV: "prod"
      DATABASE_URL: postgres://adminstudio:adminstudio@db:5432/adminstudio?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/healthcheck || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres_data: