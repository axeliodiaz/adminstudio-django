name: Tests

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  tests:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements/base.txt
            requirements/prod.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/prod.txt

      - name: Show environment
        run: |
          python --version
          pip --version
          pip freeze

      - name: Run tests
        env:
          DJANGO_DEBUG: "0"
          DJANGO_ENV: "prod"
          DATABASE_URL: sqlite:////tmp/adminstudio-ci.sqlite3
        run: |
          pytest -n 10 -q -W ignore
