# Ping the Render web service so the free tier does not spin down during quiet hours.
# Uses the lightweight liveness endpoint (no database). Safe to run every 10 minutes.
name: Render keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Warm adminstudio-django on Render
        run: |
          curl -fsS --max-time 30 \
            "https://adminstudio-django.onrender.com/api/healthcheck/live/" \
            -H "Accept: application/json"
