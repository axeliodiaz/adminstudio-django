version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.local
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=adminstudio_django.settings.local
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=rpc://
      - MONGO_DB_NAME=adminstudio_mongo
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
    depends_on:
      - rabbitmq
      - mongo
    env_file:
      - .env

  worker:
    build:
      context: .
      dockerfile: Dockerfile.local
    command: celery -A adminstudio_django.celery_app worker -l info
    volumes:
      - .:/app
    environment:
      - DJANGO_SETTINGS_MODULE=adminstudio_django.settings.local
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=rpc://
      - MONGO_DB_NAME=adminstudio_mongo
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
    depends_on:
      - rabbitmq
      - mongo
    env_file:
      - .env

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  mongo:
    image: mongo:6
    container_name: mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: adminstudio_mongo

  flower:
    image: mher/flower
    ports:
      - "5555:5555"
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
    depends_on:
      - rabbitmq
      - worker

volumes:
  mongo_data: